[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-data-engineering-lab"
version = "0.1.0"
description = "Synthetic clinical data engineering and SQL learning project"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
