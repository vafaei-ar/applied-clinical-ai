# How to say terms aloud. Used by the text-to-speech converter (src/clinical_tutor/speech.py).
#
# Keys are matched as whole words, case-sensitively, longest first. The value is the text that is
# handed to the voice, so spell letters with spaces ("A U ROC") and write words phonetically
# ("fire"). Spell letters in CAPITALS: a lowercase "a" is read as the article "uh", so "S a M D"
# comes out as "S-uh-M-D". Plurals of all-capital keys are handled automatically ("CIs" -> "C I s").
#
# Unknown ALL-CAPS tokens of 2 to 6 letters that are not listed here are spelled out letter by
# letter, which is usually right (DM, LB, NLP). List anything that should be read as a word.
# After adding a term, run `pytest tests/test_speech.py` and `python tts_bench/run.py` to hear it.

