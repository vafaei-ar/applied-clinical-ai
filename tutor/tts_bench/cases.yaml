# Challenge set for choosing a text-to-speech voice. Every case is real lesson text (or a whole
# lesson step) that voices tend to get wrong. `terms` are the things a listener should hear;
# 'a|b' lists acceptable renderings. `source` is lesson#step. Run: python tts_bench/run.py
cases:
- id: acr-terminologies
  category: acronyms
  kind: text
  source: m06-01-interop-standards#2
  why: 'Four ways to say an acronym in one line: as a word (SNOMED, LOINC), with a half word (RxNorm),
    and by letters.'
  terms:
  - SNOMED CT|snow med
  - LOINC|loink|lonk|lynk|loint|loyn
  - RxNorm|R x norm|rx norm
  - ICD-10-CM
  - CPT
  text: 'Under all three sit the **terminologies**: SNOMED CT, LOINC, RxNorm, ICD-10-CM, CPT.'
- id: acr-dicom
  category: acronyms
  kind: text
  source: m10-01-data-and-labels#6
  why: Hyphenated protocol names that look like words in capitals but must not be spelled out.
  terms:
  - DICOM
  - C-STORE|C store
  - C-FIND|C find
  - C-MOVE|C move
  - DICOMweb|DICOM web
  - QIDO-RS|QIDORS|QIDO|quito rs|keto rs
  - WADO-RS|WADORS|WADO
  - STOW-RS|STORS|STOWRS|stow rs
  - HTTPS
  text: |-
    Images move by DICOM network services: **C-STORE** pushes, **C-FIND** and **C-MOVE** query and
    retrieve, and **DICOMweb** (QIDO-RS, WADO-RS, STOW-RS) does the same over HTTPS.
- id: acr-sdtm
  category: acronyms
  kind: text
  source: m04-06-cdisc#24
  why: A run of two-letter domain codes that sound alike when spoken fast.
  terms:
  - SDTM
  - USUBJID
  - ISO 8601
  - DM
  - AE
  - LB
  - VS
  - EX
  - CM
  - DS
  text: 'SDTM: `USUBJID`, domain-prefixed variables, ISO 8601 dates; know DM, AE, LB, VS, EX, CM, DS'
- id: acr-id-spaces
  category: acronyms
  kind: text
  source: m11-02-extraction#30
  why: Four similar identifiers that must stay distinct to the ear.
  terms:
  - CUI
  - SNOMED CT|snow med
  - RxCUI
  - ICD-10-CM
  text: CUI, SNOMED CT ID, RxCUI, and ICD-10-CM code are different ID spaces
- id: acr-auroc
  category: acronyms
  kind: text
  source: m02-04-metrics-imbalance#4
  why: The most common acronym in the course, in a sentence that also stresses 'non-readmitted'.
  terms:
  - AUROC
  - randomly chosen
  - readmitted
  - non-readmitted
  text: |-
    AUROC is the probability that a randomly chosen readmitted patient
    scores higher than a randomly chosen non-readmitted one.
- id: acr-databricks
  category: acronyms
  kind: text
  source: m01-07-scale-and-tools#6
  why: Product names that are not dictionary words.
  terms:
  - Databricks
  - Spark
  - Delta Lake
  - Unity Catalog
  - Snowflake
  - BigQuery
  text: |-
    **Databricks** is a managed Spark platform. It
    adds Delta Lake tables, Unity Catalog governance and access control, scheduled jobs, and
    notebooks.

    Snowflake and BigQuery
- id: acr-saMD
  category: acronyms
  kind: text
  source: m03-06-lifecycle-regulation#13
  why: A long expansion followed by two acronyms.
  terms:
  - Software as a Medical Device
  - SaMD|sam D|S A M D|SAMD
  - International Medical Device Regulators Forum
  - IMDRF
  text: |-
    is called **Software as a Medical Device
