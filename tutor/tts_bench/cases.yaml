  text: |-
    DP-SGD (Abadi et al., CCS 2016) changes the training step in three ways:

    - **Clip** each example's gradient to a maximum norm C, which bounds any one person's
      influence.
    - **Add Gaussian noise** scaled to C (standard deviation sigma times C) to the summed
      gradient
