- id: acr-tripod
  category: acronyms
  kind: text
  source: m02-06-subgroups-shift#22
  why: A '+' inside a name, and an author citation.
  terms:
  - TRIPOD+AI|tripod plus AI
  - BMJ
  - '2015'
  - TRIPOD
  text: |-
    **TRIPOD+AI** (Collins et al., BMJ 2024) updates the 2015 TRIPOD statement for prediction
    models built with regression or machine learning.
- id: acr-ckd-epi
  category: acronyms
  kind: text
  source: m02-06-subgroups-shift#14
  why: En dash between acronyms, a hyphenated name, and a year said three times.
  terms:
  - '2021'
  - NKF
  - ASN
  - CKD-EPI|CKD EP|CKDAP|CKD epi|CKDEP
  - NEJM
  text: |-
    In **2021** the NKF–ASN task force recommended dropping race, and the **CKD-EPI 2021
    equation** was refit without it (Inker et al., NEJM 2021).
