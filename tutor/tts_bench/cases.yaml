- id: num-kappa
  category: numbers and statistics
  kind: text
  source: m05-04-generation-eval#19
  why: An equation read aloud, with a Greek letter and a subscript.
  terms:
  - 70%|70 percent|seventy percent
  - '0.58'
  - '0.52'
  - kappa|cap|capa
  - equals
  text: |-
    Each rater says "supported" 70% of the time, so p_e = 0.7 ×
    0.7 + 0.3 × 0.3 = 0.58. κ = (0.80 − 0.58)/(1 − 0.58) ≈ 0.52.
